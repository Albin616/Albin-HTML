<html> <body>

<h2>Change Background Color</h2>

<button onclick="changeColor()">Change Color</button>

<script> function changeColor() { let colors = ["red", "blue", "green", "yellow", "pink", "orange", "violet"]; let random = Math.floor(Math.random() * colors.length); document.body.style.backgroundColor = colors[random]; } </script>

</body> </html>
