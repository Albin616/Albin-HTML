<!DOCTYPE html>
<html>
<head>
    <title>Different Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: green;
        }

        .internal {
            background-color: lightyellow;
            padding: 10px;
            border: 2px solid orange;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="wp15.css">
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red; background-color: lightblue;">
        CSS Styling Methods
    </h1>

    <h2>Inline CSS</h2>
    <p style="color: purple; font-size: 20px;">
        This paragraph uses Inline CSS.
    </p>

    <h2>Internal CSS</h2>
    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <h2>External CSS</h2>
    <p class="external">
        This paragraph uses External CSS.
    </p>

</body>
</html>
