<html> <body>

<h2>Registration Form</h2>

<form onsubmit="return validate()">

Name: <input type="text" id="name"><br><br>

Email: <input type="text" id="email"><br><br>

Password: <input type="password" id="password"><br><br>

Confirm Password: <input type="password" id="confirm"><br><br>

Phone Number: <input type="text" id="phone"><br><br>

Gender: <input type="radio" name="gender" value="Male">Male <input type="radio" name="gender" value="Female">Female <br><br>

<input type="checkbox" id="terms"> I agree to the terms and conditions <br><br>

<input type="submit" value="Register"> <input type="reset" value="Clear">

</form>

<script> function validate() { 
let name=document.getElementById("name").value; 
let email=document.getElementById("email").value; 
let password=document.getElementById("password").value; 
let confirm=document.getElementById("confirm").value; 
let phone=document.getElementById("phone").value; 
let gender=document.getElementsByName("gender"); 
let selected=false; for(let i=0;i<gender.length;i++) { 
if(gender[i].checked) { selected=true; } } 
if(name=="") { alert("Please enter your name"); return false; } 
if(email=="" || !email.includes("@") || !email.includes(".")) { 
alert("Please enter a valid email"); return false; } if(password.length<6) { 
alert("Password must contain at least 6 characters"); return false; } 
if(password!=confirm) { alert("Passwords do not match"); return false; } 
if(phone.length!=10 || isNaN(phone)) { alert("Please enter a valid 10 digit phone number"); return false; } 
if(selected==false) { alert("Please select your gender"); return false; } 
if(!document.getElementById("terms").checked) { 
alert("Please accept the terms and conditions"); return false; } 
alert("Registration Successful!"); return false; } </script>

</body> </html>
